[workspace]
resolver = "2"
members = [
    "crates/knolo-agent-core",
    "crates/knolo-agent",
    "crates/knolo-agent-wasm",
    "crates/knolo-agent-icp",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
version = "0.2.2"

[workspace.dependencies]
knolo-agent-core = { path = "crates/knolo-agent-core", version = "0.2.2" }
knolo-agent = { path = "crates/knolo-agent", version = "0.2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
