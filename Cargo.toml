[workspace]
resolver = "2"
members = [
    "crates/knolo-agent-core",
    "crates/knolo-agent",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"
version = "0.1.0"

[workspace.dependencies]
knolo-agent-core = { path = "crates/knolo-agent-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
