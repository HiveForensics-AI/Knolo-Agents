name: CI
on: [push, pull_request]
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy: { matrix: { task: [fmt, lint, unit, conformance] } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: |
          case '${{ matrix.task }}' in
            fmt) cargo fmt --all --check ;;
            lint) cargo clippy --workspace --all-targets -- -D warnings ;;
            unit) cargo test --workspace --lib ;;
            conformance) cargo test --workspace --tests ;;
          esac
  typescript:
    runs-on: ubuntu-latest
    strategy: { matrix: { task: [format-lint, unit, conformance, package] } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541dca151540becc8114408c7e2c4a
        with: { node-version: 20, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: |
          case '${{ matrix.task }}' in
            format-lint) pnpm --filter @knolo/agents check ;;
            unit) pnpm --filter @knolo/agents test ;;
            conformance) pnpm --filter @knolo/agents test ;;
            package) cd packages/agents && npm pack --pack-destination /tmp && tar -tf /tmp/knolo-agents-*.tgz ;;
          esac
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo check -p knolo-agent-wasm --target wasm32-unknown-unknown
      - run: cargo test -p knolo-agent-wasm
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541dca151540becc8114408c7e2c4a
        with: { node-version: 20 }
      - run: ./scripts/hygiene.sh
      - run: node scripts/check-links.mjs
      - run: node scripts/check-packs.mjs
      - run: |
          test -z "$(git status --short)"
          cargo package -p knolo-agent-core --no-verify --list
          cargo package -p knolo-agent --no-verify --list
