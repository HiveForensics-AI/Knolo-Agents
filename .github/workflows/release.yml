name: Release
on:
  workflow_dispatch:
    inputs:
      artifact: { type: choice, options: [knolo-agent, knolo-agent-core, agents], required: true }
      version: { type: string, required: true }
permissions: { contents: write, id-token: write }
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@1e60f620b9541dca151540becc8114408c7e2c4a
        with: { node-version: 20, registry-url: https://registry.npmjs.org }
      - run: ./scripts/hygiene.sh
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: cargo test --workspace && pnpm --filter @knolo/agents test
      - name: Verify selected version and publication contents
        run: |
          case '${{ inputs.artifact }}' in
            knolo-agent|knolo-agent-core) cargo package -p '${{ inputs.artifact }}' --list ;;
            agents) test "$(node -p "require('./packages/agents/package.json').version")" = '${{ inputs.version }}'; cd packages/agents && npm pack --pack-destination /tmp ;;
          esac
      - name: Publish
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}", CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
        run: |
          case '${{ inputs.artifact }}' in
            knolo-agent|knolo-agent-core) cargo publish -p '${{ inputs.artifact }}' ;;
            agents) pnpm --filter @knolo/agents publish --access public --no-git-checks ;;
          esac
